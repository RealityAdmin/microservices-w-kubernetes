apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-service-deployment
  labels:
    app: products

spec:
  replicas: 2
  selector:
    matchLabels:
      app: products
  template:
    metadata:
      labels:
        app: products
    spec:
      containers:
      - name: products
        image: realityadmin/products:1.1.0
        ports:
          - containerPort: 8081
